[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynasid-poi"
version = "0.2.0"
description = "可在 CPU 上复现的语义 ID 审计与动态下一 POI 检索"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "torch>=2.3",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
